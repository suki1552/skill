<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OB 콜봇 대화 시뮬레이터</title>
<style>
  :root{
    --primary:#5B4FE8; --primary-d:#3D34B0; --accent:#00C9A7; --accent-d:#00A98C;
    --ink:#1E1B39; --muted:#6B7280; --line:#E6E7F0; --bg:#F6F7FB;
    --bot:#EEF0FF; --user:#5B4FE8; --danger:#F0526B; --warn:#F5A524;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:
    radial-gradient(1200px 600px at 10% -10%,#efeaff 0,transparent 55%),
    radial-gradient(900px 500px at 110% 10%,#d9fff5 0,transparent 50%),var(--bg);
    color:var(--ink);min-height:100vh;padding:28px 16px}
  .wrap{max-width:1120px;margin:0 auto}
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--accent));
    display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 8px 20px rgba(91,79,232,.35)}
  header.top h1{font-size:20px;letter-spacing:-.3px}
  header.top p{font-size:13px;color:var(--muted);margin-top:2px}
  .home{margin-left:auto;font-size:13px;color:var(--primary);text-decoration:none;font-weight:600;
    border:1px solid var(--line);padding:8px 14px;border-radius:10px;background:#fff}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}

  /* left panel */
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(30,27,57,.05)}
  .panel h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
  .scen{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;
    padding:14px 15px;margin-bottom:11px;cursor:pointer;transition:.16s}
  .scen:hover{border-color:var(--primary);transform:translateY(-1px)}
  .scen.active{border-color:var(--primary);background:linear-gradient(135deg,#f4f2ff,#eafff9)}
  .scen .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:7px}
  .tag.css{background:#eae7ff;color:var(--primary-d)} .tag.oss{background:#ffe8ec;color:#c8324a}
  .scen b{display:block;font-size:15px;margin-bottom:3px}
  .scen span.d{font-size:12px;color:var(--muted);line-height:1.45}
  .legend{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.7}
  .legend b{color:var(--ink)}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .kpi{background:var(--bg);border-radius:12px;padding:12px}
  .kpi .n{font-size:22px;font-weight:800;color:var(--primary)}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:2px}

  /* phone */
  .stage{display:flex;justify-content:center}
  .phone{width:390px;max-width:100%;background:#0e0b24;border-radius:38px;padding:14px;
    box-shadow:0 30px 60px rgba(20,15,60,.35);position:relative}
  .notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0e0b24;border-radius:0 0 16px 16px;z-index:5}
  .screen{background:linear-gradient(180deg,#f3f4fb,#ffffff);border-radius:28px;overflow:hidden;height:660px;display:flex;flex-direction:column;position:relative}
  .cbar{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;padding:34px 18px 14px;display:flex;align-items:center;gap:11px}
  .cbar .av{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:19px}
  .cbar b{font-size:15px;display:block}
  .cbar small{font-size:11.5px;opacity:.85}
  .callstate{margin-left:auto;font-size:11px;background:var(--accent);color:#062;padding:4px 10px;border-radius:999px;font-weight:800;
    display:flex;align-items:center;gap:5px}
  .callstate .dot{width:7px;height:7px;border-radius:50%;background:#062;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}

  /* launcher banner (음성-시각 크로스 채널) */
  .launcher{margin:12px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 8px 18px rgba(91,79,232,.14);opacity:0;transform:translateY(-8px);height:0;transition:.35s}
  .launcher.show{opacity:1;transform:none;height:auto}
  .launcher .lh{background:linear-gradient(135deg,#1b1442,#3a2d8c);color:#fff;padding:9px 13px;font-size:11px;display:flex;align-items:center;gap:6px}
  .launcher .lh .pip{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .launcher .lb{padding:13px;display:flex;gap:12px;align-items:center;background:#fff}
  .launcher .lb .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#eef,#dff);display:grid;place-items:center;font-size:21px}
  .launcher .lb b{font-size:13.5px} .launcher .lb p{font-size:11.5px;color:var(--muted);margin-top:2px}

  .chat{flex:1;overflow-y:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:9px}
  .chat::-webkit-scrollbar{width:5px}.chat::-webkit-scrollbar-thumb{background:#d4d6e6;border-radius:9px}
  .msg{max-width:82%;padding:10px 13px;border-radius:15px;font-size:13.5px;line-height:1.5;animation:pop .25s}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}}
  .msg.bot{background:var(--bot);color:var(--ink);align-self:flex-start;border-bottom-left-radius:5px}
  .msg.user{background:var(--user);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
  .msg.sys{align-self:center;background:#eafff8;color:#067a63;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid #bff0e2}
  .msg.sys.warn{background:#fff6e6;color:#a56a00;border-color:#ffe1a8}
  .who{font-size:10px;color:var(--muted);margin:0 4px}
  .typing{align-self:flex-start;background:var(--bot);padding:11px 15px;border-radius:15px;border-bottom-left-radius:5px;display:flex;gap:4px}
  .typing span{width:6px;height:6px;border-radius:50%;background:#9aa0c9;animation:tp 1.1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

  .choices{padding:10px 12px 14px;border-top:1px solid var(--line);background:#fbfbff;display:flex;flex-direction:column;gap:8px;min-height:56px}
  .choices .row{display:flex;gap:8px;flex-wrap:wrap}
  .choice{flex:1;min-width:calc(50% - 4px);border:1.5px solid var(--primary);color:var(--primary);background:#fff;
    padding:11px 10px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;transition:.14s}
  .choice:hover{background:var(--primary);color:#fff}
  .choice.full{min-width:100%}
  .choice.ghost{border-color:var(--line);color:var(--muted)}
  .choice.ghost:hover{background:var(--muted);color:#fff;border-color:var(--muted)}
  .choice.danger{border-color:var(--danger);color:var(--danger)}
  .choice.danger:hover{background:var(--danger);color:#fff}
  .restart{width:100%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;
    padding:12px;border-radius:12px;font-size:13.5px;font-weight:800;cursor:pointer}
  .hint{font-size:11px;color:var(--muted);text-align:center;padding:2px}

  /* calendar */
  .cal{padding:8px 2px}
  .cal .cg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .cal .slot{border:1.5px solid var(--line);border-radius:11px;padding:9px 4px;text-align:center;cursor:pointer;background:#fff;transition:.14s}
  .cal .slot:hover{border-color:var(--primary);background:#f4f2ff}
  .cal .slot .dd{font-size:14px;font-weight:800} .cal .slot .tt{font-size:11px;color:var(--muted);margin-top:2px}
  .cal .slot.off{opacity:.35;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">📞</div>
    <div>
      <h1>OB 콜봇 대화 시뮬레이터</h1>
      <p>출동 최적화 스케줄링 Agent · 고객 입장에서 콜봇과 대화를 체험해 보세요</p>
    </div>
    <a class="home" href="index.html">← 목록</a>
  </header>

  <div class="grid">
    <!-- LEFT -->
    <div>
      <div class="panel">
        <h2>시나리오 선택</h2>
        <button class="scen active" data-s="book" onclick="pick('book',this)">
          <span class="tag css">개통 · CSS</span>
          <b>방문일정 예약</b>
          <span class="d">신규가입·이사·상품변경 고객에게 발신하여 방문 일정을 예약합니다 (달력/제안)</span>
        </button>
        <button class="scen" data-s="d1" onclick="pick('d1',this)">
          <span class="tag css">개통 · CSS</span>
          <b>D-1 방문일정 안내</b>
          <span class="d">방문 하루 전 일정을 안내하고 확정·변경·취소를 처리합니다</span>
        </button>
        <button class="scen" data-s="oss" onclick="pick('oss',this)">
          <span class="tag oss">장애 · OSS</span>
          <b>장애 D-1 방문일정</b>
          <span class="d">CEI 진단 결과에 따라 방문 필요 여부를 판단하고 일정을 안내합니다</span>
        </button>
        <div class="kpis">
          <div class="kpi"><div class="n" id="kTurn">0</div><div class="l">진행 턴</div></div>
          <div class="kpi"><div class="n" id="kResult">—</div><div class="l">처리 결과</div></div>
        </div>
      </div>
      <div class="panel" style="margin-top:16px">
        <h2>동작 방식</h2>
        <div class="legend">
          <b>PDS</b> 타겟 고객에게 자동 콜 발신<br>
          <b>런처 솔루션</b> 통화와 동시에 화면에 팝업 배너 노출 (음성–시각 크로스 채널)<br>
          <b>Swing 연동</b> 예약 확정 시 자동 확인 문자 발송<br>
          <span style="color:#c8324a"><b>미응답</b> 재시도 후 문자 발송으로 대체</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: PHONE -->
    <div class="stage">
      <div class="phone">
        <div class="notch"></div>
        <div class="screen">
          <div class="cbar">
            <div class="av">🤖</div>
            <div><b>OB 콜봇</b><small id="subLine">출동 최적화 스케줄링</small></div>
            <div class="callstate"><span class="dot"></span>통화중</div>
          </div>
          <div class="launcher" id="launcher">
            <div class="lh"><span class="pip"></span>런처 솔루션 · 화면 팝업 배너</div>
            <div class="lb">
              <div class="ic" id="lIc">📅</div>
              <div><b id="lTit">방문 일정 예약</b><p id="lSub">통화 내용을 화면에서 함께 확인하세요</p></div>
            </div>
          </div>
          <div class="chat" id="chat"></div>
          <div class="choices" id="choices"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- 대화 시나리오 정의 (딜의 Flow 기반 상태머신) ---------- */
const SCEN = {
  book:{ sub:"개통 · 방문일정 예약", lIc:"📅", lTit:"방문 일정 예약", lSub:"원하시는 방문 날짜를 선택하세요", start:"g0" },
  d1:{ sub:"개통 · D-1 일정 안내", lIc:"🔔", lTit:"D-1 방문 안내", lSub:"내일 방문 일정을 확인하세요", start:"h0" },
  oss:{ sub:"장애 · D-1 일정 안내", lIc:"🛠️", lTit:"장애 방문 안내", lSub:"장애 처리 방문 일정 확인", start:"o0" }
};

/* 각 노드: {bot:[...말풍선], choices:[{t,go,style,tag}], calendar:true, end:res } */
const FLOW = {
  /* ===== 개통 방문일정 예약 ===== */
  g0:{bot:["안녕하세요, 고객님. 출동 최적화 스케줄링 안내를 도와드리는 OB 콜봇입니다. 😊","신규 개통 설치를 위한 <b>방문 일정 예약</b> 안내차 연락드렸습니다. 통화 가능하실까요?"],
     choices:[{t:"네, 가능합니다",go:"g1"},{t:"(응답 없음)",go:"gNo",style:"ghost"}]},
  gNo:{bot:["고객님, 응답이 없어 잠시 후 다시 연결드리겠습니다."],sys:"미응답 → 재시도 예약",
     choices:[{t:"▶ 재시도 발신",go:"gRetry",style:"full"}]},
  gRetry:{bot:["(재시도) 다시 연결이 어려워 <b>안내 문자</b>로 대체 발송했습니다.","문자 내 링크에서 직접 일정 예약이 가능합니다."],sys:"문자 발송 완료",end:"문자 대체"},
  g1:{bot:["감사합니다. 먼저 본인 확인을 진행하겠습니다.","계약자 성함과 생년월일이 홍*동 / 90년생 맞으실까요?"],
     choices:[{t:"네, 맞습니다",go:"g2"},{t:"아니요",go:"gStop",style:"ghost"}]},
  gStop:{bot:["본인 확인이 어려워 상담사 연결 또는 문자 안내로 전환하겠습니다."],sys:"본인확인 실패 → 전환",end:"상담 전환"},
  g2:{bot:["확인되었습니다. ✅","희망하시는 <b>방문 날짜와 시간대</b>를 선택해 주세요. 화면의 달력에서도 선택 가능합니다."],launcher:"cal",calendar:true,
     choices:[{t:"콜봇이 시간을 제안해 주세요",go:"g3",style:"full ghost"}]},
  g3:{bot:["가장 빠른 <b>7월 26일(토) 오전 10~12시</b>는 어떠실까요?"],
     choices:[{t:"좋아요, 그때로 할게요",go:"gDone",tag:"7/26(토) 오전"},{t:"다른 시간 볼게요",go:"g2",style:"ghost"}]},
  gDone:{bot:["예약이 확정되었습니다! 🎉","<b>Swing 시스템</b>에 자동 반영하고, 확인 문자를 발송해 드렸습니다.","방문 전 사전 알림도 자동으로 보내드릴게요. 감사합니다."],sys:"Swing 연동 · 예약 확정 · 확인문자 발송",end:"예약 완료"},

  /* ===== 개통 D-1 안내 ===== */
  h0:{bot:["안녕하세요 고객님, OB 콜봇입니다. 😊","<b>내일(D-1) 개통 설치 방문</b> 일정 안내드립니다."],
     choices:[{t:"네, 확인할게요",go:"h1"},{t:"(응답 없음)",go:"gNo",style:"ghost"}]},
  h1:{bot:["예약된 일정은 <b>7월 25일(금) 오후 2~4시</b> 입니다.","이대로 방문 진행할까요?"],launcher:"bell",
     choices:[{t:"네, 그대로 방문해 주세요",go:"hOk"},{t:"시간을 변경하고 싶어요",go:"hChg",style:"ghost"},{t:"방문을 취소할게요",go:"hCancel",style:"danger full"}]},
  hOk:{bot:["일정이 확정되었습니다. ✅","방문 1시간 전 기사님이 도착 알림을 보내드립니다. 감사합니다!"],sys:"일정 확정 · 사전 알림 예약",end:"방문 확정"},
  hChg:{bot:["변경을 도와드리겠습니다. 원하시는 시간대를 선택해 주세요."],launcher:"cal",calendar:true,
     choices:[{t:"콜봇이 재조정 제안",go:"hChg2",style:"full ghost"}]},
  hChg2:{bot:["<b>7월 27일(일) 오전 10~12시</b>로 재조정 가능합니다. 진행할까요?"],
     choices:[{t:"네, 변경할게요",go:"hChgDone",tag:"7/27(일) 오전"},{t:"취소할게요",go:"hCancel",style:"danger"}]},
  hChgDone:{bot:["일정이 변경되었습니다. 🔄","<b>Swing</b>에 재조정 내용을 반영하고 변경 확인 문자를 보내드렸어요."],sys:"스케줄 재조정 · 확인문자 발송",end:"일정 변경"},
  hCancel:{bot:["방문 취소로 접수하겠습니다. 취소가 맞으실까요?"],
     choices:[{t:"네, 취소합니다",go:"hCancelDone",style:"danger"},{t:"아니요, 유지할게요",go:"h1",style:"ghost"}]},
  hCancelDone:{bot:["취소 처리되었습니다.","재예약이 필요하시면 언제든 다시 도와드리겠습니다. 감사합니다."],sys:"취소 처리 · Swing 반영",end:"방문 취소"},

  /* ===== 장애 D-1 (CEI 진단 분기) ===== */
  o0:{bot:["안녕하세요 고객님, OB 콜봇입니다. 🛠️","접수하신 <b>장애 건</b>의 방문 처리 일정을 안내드립니다. 먼저 현재 장애 상태를 확인하겠습니다."],
     choices:[{t:"네, 확인해 주세요",go:"o1"},{t:"(응답 없음)",go:"gNo",style:"ghost"}]},
  o1:{bot:["<b>CEI 원격 진단</b>을 실행합니다... 🔎"],sys:"CEI 진단 실행 중",
     choices:[{t:"▶ 진단 결과 보기",go:"oDiag",style:"full"}]},
  oDiag:{bot:["진단 결과를 안내드립니다. 회선 상태에 따라 방문 필요 여부가 달라집니다."],
     choices:[{t:"[정상 감지] 방문 불필요 케이스",go:"oNorm",tag:"CEI: 정상"},{t:"[이상 감지] 방문 필요 케이스",go:"oNeed",tag:"CEI: 이상",style:""}]},
  oNorm:{bot:["원격 진단 결과 <b>회선이 정상 복구</b>되었습니다. ✅","현재는 <b>방문이 불필요</b>하여 예약을 자동 취소 처리했습니다.","혹시 이후 증상이 재발하면 바로 다시 도와드리겠습니다. 감사합니다!"],sys:"방문 불필요 · 취소 처리",end:"방문 불필요"},
  oNeed:{bot:["진단 결과 <b>현장 점검이 필요한 상태</b>입니다.","내일 <b>7월 25일(금) 오전 9~11시</b> 기사 방문 예정입니다. 이대로 진행할까요?"],launcher:"tool",
     choices:[{t:"네, 방문해 주세요",go:"oOk"},{t:"시간을 변경할게요",go:"oChg",style:"ghost"},{t:"취소할게요",go:"oCancel",style:"danger full"}]},
  oOk:{bot:["방문이 확정되었습니다. ✅","방문 전 사전 알림 문자를 자동 발송해 드립니다. 빠르게 해결해 드릴게요!"],sys:"방문 확정 · 사전 알림",end:"방문 확정"},
  oChg:{bot:["변경 도와드리겠습니다. 원하시는 시간대를 선택해 주세요."],launcher:"cal",calendar:true,
     choices:[{t:"콜봇이 재조정 제안",go:"oChg2",style:"full ghost"}]},
  oChg2:{bot:["<b>7월 26일(토) 오후 1~3시</b>로 재조정 가능합니다. 진행할까요?"],
     choices:[{t:"네, 변경할게요",go:"oChgDone",tag:"7/26(토) 오후"},{t:"취소할게요",go:"oCancel",style:"danger"}]},
  oChgDone:{bot:["일정이 변경되었습니다. 🔄","<b>Swing</b>에 재조정 반영 및 변경 확인 문자를 발송했습니다."],sys:"스케줄 재조정 · 확인문자",end:"일정 변경"},
  oCancel:{bot:["방문 취소로 접수하겠습니다. 취소가 맞으실까요?"],
     choices:[{t:"네, 취소합니다",go:"oCancelDone",style:"danger"},{t:"아니요, 유지할게요",go:"oNeed",style:"ghost"}]},
  oCancelDone:{bot:["취소 처리되었습니다. 필요 시 언제든 다시 접수 도와드리겠습니다."],sys:"취소 처리 · Swing 반영",end:"방문 취소"}
};

let cur='book', turns=0;
const chat=document.getElementById('chat'), choicesEl=document.getElementById('choices');
const launcher=document.getElementById('launcher');

function pick(s,el){
  cur=s;
  document.querySelectorAll('.scen').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('subLine').textContent=SCEN[s].sub;
  restart();
}
function restart(){
  chat.innerHTML=''; choicesEl.innerHTML=''; turns=0;
  document.getElementById('kTurn').textContent=0;
  document.getElementById('kResult').textContent='—';
  launcher.classList.remove('show');
  const sc=SCEN[cur];
  document.getElementById('lIc').textContent=sc.lIc;
  document.getElementById('lTit').textContent=sc.lTit;
  document.getElementById('lSub').textContent=sc.lSub;
  goNode(sc.start);
}
function addMsg(text,cls){
  const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=text; chat.appendChild(d); scroll();
}
function scroll(){ chat.scrollTop=chat.scrollHeight; }
function showLauncher(kind){
  const map={cal:["📅","일정 선택","달력에서 방문 시간을 선택하세요"],bell:["🔔","D-1 방문 안내","내일 방문 일정을 확인하세요"],
    tool:["🛠️","장애 방문 안내","현장 점검 방문 일정 확인"]};
  if(map[kind]){document.getElementById('lIc').textContent=map[kind][0];
    document.getElementById('lTit').textContent=map[kind][1];document.getElementById('lSub').textContent=map[kind][2];}
  launcher.classList.add('show');
}

async function goNode(id){
  const n=FLOW[id]; if(!n) return;
  choicesEl.innerHTML='';
  if(n.launcher) showLauncher(n.launcher);
  // bot messages with typing delay
  for(const line of n.bot){
    await typing(500+Math.min(line.length*14,650));
    addMsg(line,'bot');
    turns++; document.getElementById('kTurn').textContent=turns;
  }
  if(n.sys) addMsg('⚙️ '+n.sys,'sys'+(/미응답|실패|취소|불필요/.test(n.sys)?' warn':''));
  // calendar
  if(n.calendar) renderCalendar(id);
  // choices
  if(n.choices){
    n.choices.forEach(c=>{
      const b=document.createElement('button');
      b.className='choice '+(c.style||'');
      b.textContent=c.t;
      b.onclick=()=>{ userSay(c.tag||c.t); goNode(c.go); };
      wrapChoice(b);
    });
  }
  if(n.end){
    document.getElementById('kResult').textContent=n.end;
    const b=document.createElement('button'); b.className='restart'; b.textContent='🔄 처음부터 다시 체험';
    b.onclick=restart; choicesEl.appendChild(b);
    const h=document.createElement('div'); h.className='hint'; h.textContent='통화 종료 · 결과: '+n.end; choicesEl.appendChild(h);
  }
}
function wrapChoice(b){
  let row=choicesEl.querySelector('.row:last-child');
  const full=b.classList.contains('full');
  if(full||!row){row=document.createElement('div');row.className='row';choicesEl.appendChild(row);}
  row.appendChild(b);
  if(full){const r2=document.createElement('div');r2.className='row';choicesEl.appendChild(r2);}
}
function userSay(t){
  addMsg(t.replace(/^\(|\)$/g,'')||t,'user');
  turns++; document.getElementById('kTurn').textContent=turns;
}
function typing(ms){
  return new Promise(res=>{
    const t=document.createElement('div'); t.className='typing'; t.innerHTML='<span></span><span></span><span></span>';
    chat.appendChild(t); scroll();
    setTimeout(()=>{t.remove();res();},ms);
  });
}
function renderCalendar(back){
  const slots=[["25","금 오후"],["26","토 오전"],["26","토 오후"],["27","일 오전"],
    ["28","월 오전"],["28","월 오후"],["29","화 오전"],["30","수 오후"]];
  const wrap=document.createElement('div'); wrap.className='cal';
  const g=document.createElement('div'); g.className='cg';
  slots.forEach((s,i)=>{
    const el=document.createElement('div'); el.className='slot'+(i===2?' off':'');
    el.innerHTML='<div class="dd">7/'+s[0]+'</div><div class="tt">'+s[1]+'</div>';
    el.onclick=()=>{ userSay('7/'+s[0]+' '+s[1]+' 선택'); goDoneFromCal(back); };
    g.appendChild(el);
  });
  wrap.appendChild(g); choicesEl.appendChild(wrap);
}
function goDoneFromCal(back){
  // 달력 선택 시 각 시나리오 확정 노드로
  const doneMap={g2:"gDone",hChg:"hChgDone",oChg:"oChgDone"};
  goNode(doneMap[back]||"gDone");
}

restart();
</script>
